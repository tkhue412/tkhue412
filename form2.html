<!DOCTYPE html>
<html>
    <head>
        <title>Form 2</title>
    </head>
    <body>
        <form action="signin.php" method="post">
            <table border="1">
                <tr>
                    <td colspan="2" bgcolor="yellow"> <h1>Registration</h1></td>
                </tr>
                <tr>
                    <td>Enter name </td>
                    <td> <input type="text" name="name"></td>
                </tr>
                <tr>
                    <td>Enter password</td>
                    <td> <input type="text" name="password"></td>
                </tr>
                <tr>
                    <td>Enter address</td>
                    <td><textarea name="address"></textarea></td>
                </tr>
                <tr>
                    <td>Selec Game</td>
                    <td>
                        <input type="checkbox" name="Game" id="hockey">
                        <label for="hockey">Hockey</label>
                        <br>
                        <input type="checkbox" name="Game" id="football">
                        <label for="football">Football</label>
                        <br>
                        <input type="checkbox" name="Game" id="badminton">
                        <label for="badminton">Badminton</label>
                        <br>
                        <input type="checkbox" name="Game" id="cricket">
                        <label for="cricket">Cricket</label>
                        <br>
                        <input type="checkbox" name="Game" id="voleyball">
                        <label for="voleyball">Voleyball</label>
                    </td>
                </tr>
                <tr>
                    <td>Gender</td>
                    <td>
                        <input type="radio" id="male" name="gender"/>
                        <label for="male">Male</label>
                        <input type="radio" name="gender" id="female"/>
                        <label for="female">Female</label>
                    </td>
                </tr>
                <tr>
                    <td>Age</td>
                    <td>
                        <select name="age" id="Age">
                            <option value="18">18</option>
                            <option value="18">19</option>
                            <option value="18">20</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Avatar</td>
                    <td>
                        <input type="file">
                    </td>
                </tr>
                <td colspan="2">
                    <input type="button" value="Click me">
                    <input type="reset" value="Reset">
                    <input type="submit" value="Submit">
                </td>
            </table>
        </form>
    </body>
</html>
