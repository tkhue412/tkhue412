<!DOCTYPE html>
<html>
    <head>
        <title>3 cách sử dụng CSS khác nhau</title>
        <meta charset="utf-8">
        <style type="CSS"></style>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
            }
            h1, h2 {
                color: aliceblue;
            }
            p {
                color: black;
            }
        </style>
    </head>
    <body>
        <h1 style="color: aliceblue;">Khoai Tây</h1>
        <p style="color: black;">Có hàng chục loại khoai tây khác nhau. Thường được mô tả là loại sớm, loại sớm thứ hai và loại chính.</p>
        <p style="font-family: 'Times New Roman', Times, serif; background-color: rgb(194, 152, 198); color: chocolate;" >Trần Thị Kim Huệ</p>
    </body>
</html>
