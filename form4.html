<!DOCTYPE html>
<html>
    <head>
        <title>Ôn tập các form controls</title>
    </head>
    <body>
        <form action="#" method="get">
        <p>Tên đăng nhập: 
            <input type="text" name="username" size="10" maxlength="20" id="">
        </p>
        <p>Mật khẩu: 
            <input type="password" name="password" size="15" maxlength="20" id="">
        </p>
        <p>Nhập câu hỏi bí mật:
            <textarea name="question" cols="30" rows="5" id="">Nội dung!</textarea>
        </p>
        <p>Phái: 
            <input type="radio" name="gender" id="male" checked> Nam
            <input type="radio" name="gender" id="female"> Nữ 
        </p>
        <p>Ngày sinh: <input type="date" name="date" id=""></p>
        <p>
            <fieldset>
                <legend>Sở thích</legend>
                <p>
                    <input type="checkbox" name="music" id="" value="Âm nhạc"> Âm nhạc <br>
                    <input type="checkbox" name="game" id="" value="game"> Chơi game
                </p>
            </fieldset>
        </p>
        <p>Thiết bị bạn thường sử dụng: 
            <select name="thietbi" id="thietbi">
                <option></option>
                <option value="PC">Máy tính PC</option>
                <option value="Laptop">Máy tính xách tay</option>
                <option value="Tablet" selected>Máy tính bảng</option>
                <option value="Smartphone">Điện thoại thông minh</option>
            </select>
        </p>
        <p>Thiêt bị bạn thường sử dụng (được chọn nhiều):
            <select name="thietbi2"  multiple size="10">
                <option></option>
                <option></option>
                <option value="PC">Máy tính PC</option>
                <option value="Laptop">Máy tính xách tay</option>
                <option value="Tablet" selected>Máy tính bảng</option>
                <option value="Smartphone">Điện thoại thông minh</option>
            </select>
        </p>
        <p>CV:
            <input type="file" name="CV" id="CV">
        </p>
        <input type="submit" name="submit" value="Đăng ký"> | <input type="reset" name="reset" value="Nhập lại"> | <input type="button" name="click" value="Click me!">
    </form>
    </body>
</html>
