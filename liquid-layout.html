<!DOCTYPE html>
<html>
    <head>
        <title>Fixed Width Layout</title>
        <style type="text/css">
            * {
                font-family: 'Arial Narrow', Arial, sans-serif;
                color: #665544;
                text-align: center;
            }
            body {
                width: 90%;
                margin: auto 0;
            }
            #content {
                overflow: auto;
                height: 100%;
            }
            #nav, #feature {
                background-color: #efefef;
                padding: 10px;
                margin: 1%;
            }
            footer {
                background-color: #efefef;
                padding: 0.5em 0;
            }
            .column1, .column2, .column3 {
                background-color: #efefef;
                width: 31.3%;
                float: left;
                margin: 1%;
            }
            .column3 {
                margin-right: 0%;
            }
            li {
                display: inline;
                padding: 0.5em;
            }
        </style>
    </head>
    <body>
        <div id="header">
            <h1>Logo</h1>
            <div id="nav">
                <ul>
                    <li><a href="">Home</a></li>
                    <li><a href="">Products</a></li>
                    <li><a href="">Services</a></li>
                    <li><a href="">About</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
            </div>
        </div>
        <div id="content">
            <div id="fearure">
                <p>feature</p>
            </div>
            <div class="article column1">
                <p>Column One</p>
            </div>
            <div class="article column2">
                <p>Column Two</p>
            </div>
            <div class="article column3">
                <p>Column Three</p>
            </div>
        </div>
        <div id="footer">
            <p>&copy; Copyright 2011</p>
        </div>
    </body>
</html>
